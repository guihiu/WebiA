{% extends "base.html" %}
{% block title %}{{ text.csv_title }}{% endblock %}
{% block content %}
  <section class="training-hero">
    <p class="eyebrow">CSV</p>
    <h1>{{ text.csv_title }}</h1>
    <p>{{ text.csv_intro }}</p>
  </section>

  <section class="upload-panel"
           data-csv-upload
           data-invalid-extension="{{ text.csv_invalid_extension }}"
           data-multiple-files="{{ text.csv_multiple_files }}"
           data-loading="{{ text.csv_loading }}"
           data-read-error="{{ text.csv_read_error }}"
           data-invalid-content="{{ text.csv_invalid_content }}"
           data-empty-file="{{ text.csv_empty_file }}"
           data-file-summary-template="{{ text.csv_file_summary }}"
           data-page-summary-template="{{ text.csv_page_summary }}"
           data-caption-template="{{ text.csv_table_caption }}"
           data-column-template="{{ text.csv_column }}"
           data-empty-data="{{ text.csv_empty_data }}">
    <div class="drop-zone" data-drop-zone aria-describedby="csv-drop-hint">
      <p class="drop-zone-title">{{ text.csv_drop_title }}</p>
      <p id="csv-drop-hint">{{ text.csv_drop_hint }}</p>
      <input class="visually-hidden" id="csv-file" type="file"
             accept=".csv,text/csv" data-csv-file>
      <label class="button" for="csv-file">{{ text.csv_choose_file }}</label>
    </div>

    <p class="csv-status" role="status" aria-live="polite" data-csv-status></p>

    <section class="csv-preview" data-csv-preview hidden>
      <div class="csv-controls">
        <p data-file-summary></p>
        <label class="field" for="csv-page-size">
          <span class="field-label">{{ text.csv_rows_per_page }}</span>
          <select id="csv-page-size" data-page-size>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>

      <div class="table-wrap">
        <table>
          <caption data-csv-caption></caption>
          <thead data-csv-head></thead>
          <tbody data-csv-body></tbody>
        </table>
      </div>
      <p data-empty-data hidden></p>

      <nav class="csv-pagination" aria-label="{{ text.csv_pagination_label }}">
        <button class="button secondary-button" type="button" data-previous disabled>
          {{ text.csv_previous }}
        </button>
        <span data-page-summary></span>
        <button class="button" type="button" data-next disabled>
          {{ text.csv_next }}
        </button>
      </nav>
    </section>
  </section>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='csv-preview.js') }}" defer></script>
{% endblock %}
